name: Verify
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hiring_record
          POSTGRES_PASSWORD: local_demo_only
          POSTGRES_DB: hiring_record
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiring_record -d hiring_record"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://hiring_record:local_demo_only@127.0.0.1:5432/hiring_record
      DATABASE_URL: postgres://hiring_record:local_demo_only@127.0.0.1:5432/hiring_record
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build -p record-api
      - name: Run integration smoke test
        run: |
          target/debug/record-api > /tmp/hiring-record-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/smoke.py
          node scripts/wasm-parity.mjs
