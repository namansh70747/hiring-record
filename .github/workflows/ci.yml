name: Verify
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hiring_record
          POSTGRES_PASSWORD: local_demo_only
          POSTGRES_DB: hiring_record
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hiring_record -d hiring_record"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://hiring_record:local_demo_only@127.0.0.1:5432/hiring_record
      DATABASE_URL: postgres://hiring_record:local_demo_only@127.0.0.1:5432/hiring_record
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
      - run: npm ci
        working-directory: apps/web
      - run: npm run generate:api
        working-directory: apps/web
      - run: git diff --exit-code -- apps/web/public/openapi.json apps/web/lib/api-schema.d.ts
      - run: npm audit --audit-level=moderate
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx --yes @informalsystems/quint@0.33.1 verify spec/record.qnt --invariant=safety --max-steps=20
      - run: python3 scripts/validate-model-traces.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -q -p record-cli -- sweep 10000 1
      - run: cargo build -p record-api
      - name: Run integration smoke test
        run: |
          target/debug/record-api > /tmp/hiring-record-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/smoke.py
          node scripts/wasm-parity.mjs
          python3 scripts/stream-smoke.py
          npm run test:e2e --prefix apps/web -- --workers=2

  durable-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - run: docker compose -p hiring-record up -d --build --wait
      - run: ./scripts/register-workflow.sh
      - run: cargo build -p record-api
      - name: Exercise restart and durable callbacks
        env:
          DATABASE_URL: postgres://hiring_record:local_demo_only@127.0.0.1:55432/hiring_record
          RESTATE_INGRESS: http://127.0.0.1:19080
          BIND_ADDRESS: 0.0.0.0:8080
          RESTART_NORTHWIND: '1'
        run: |
          target/debug/record-api > /tmp/hiring-record-workflow.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/workflow-smoke.py
